<!doctype html>
<html data-theme="light" lang="en" class="dark_theme">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- The 'unsafe-eval' is only temporary for use of JSONB, once the other custom better JSON parser that doesn't use eval is done, remove 'unsafe-eval'. -->
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' data: file: blob:;" />
        <meta http-equiv="Cross-Origin-Resource-Policy" content="cross-origin" />
        <meta http-equiv="Access-Control-Allow-Origin" content="*" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Bedrock World Editor</title>
        <!-- <link href="/app/index.css" rel="stylesheet" /> -->
        <style>
            html:not(.hide-splash-screen):has(div#app > div#splash-screen):not(:has(div#app-contents)) {
                background-color: hsl(0, 0%, 7%);
                color: #fff;
            }
            div#app > div#splash-screen {
                display: flex;
                width: 100vw;
                height: 100vh;
                position: fixed;
                top: 0;
                left: 0;
            }
            html.hide-splash-screen > div#app > div#splash-screen,
            div#app:has(div#app-contents) > div#splash-screen {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div id="splash-screen">
                <div style="flex: 1; overflow: auto; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center">
                    <!-- <img
                        aria-hidden="true"
                        src="resource://images/ui/misc/loading_bar.gif"
                        style="
                            vertical-align: middle;
                            width: round(down, calc(max(100vw, 300px) / 4), 64px);
                            background-color: #0008;
                            padding: calc(round(down, calc(max(100vw, 300px) / 4), 64px) / 16);
                            image-rendering: pixelated;
                        "
                    /> -->
                    <!-- style={`${props.preserveTextOffset ? "" : "margin-bottom: -1.5em; "}line-height: 1.5em; font-family: Consolas; font-size: round(down, calc(max(100vw, 300px) / 50), 5.12px);`} -->
                    <!-- <div
                        style="
                            line-height: 1.5em;
                            font-family: Consolas;
                            font-size: round(down, calc(max(100vw, 300px) / 50), 5.12px);

                            -webkit-user-select: none;
                            /* Safari */
                            -ms-user-select: none;
                            -moz-user-select: none;
                            /* IE 10 and IE 11 */
                            user-select: none;
                            /* Standard syntax */
                        "
                    >
                        Bedrock World Editor
                    </div> -->
                    <img
                        aria-hidden="true"
                        src="resource://images/title_image.png"
                        loading="eager"
                        style="
                            vertical-align: middle;
                            width: round(down, calc(max(100vw, min(max(175vw, 256px), 1536px)) / 2), 32px);
                            padding: calc(round(down, calc(max(100vw, min(max(175vw, 256px), 1536px)) / 2), 28px) / 16);
                            image-rendering: pixelated;
                        "
                    />
                    <img
                        aria-hidden="true"
                        src="resource://images/ui/misc/loading_spinner.gif"
                        loading="eager"
                        style="
                            vertical-align: middle;
                            width: round(down, calc(max(100vw, 896px) / 32), 28px);
                            /* background-color: #0008; */
                            padding: calc(round(down, calc(max(100vw, 896px) / 32), 28px) / 16);
                            image-rendering: pixelated;
                        "
                    />
                </div>
            </div>
        </div>
        <script type="module" src="/src/renderer.ts"></script>
    </body>
</html>
