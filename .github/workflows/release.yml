name: Release

on:
    # Allows you to run this workflow manually from the Actions tab or through HTTP API
    workflow_dispatch:

    push:
        tags:
            - "v*.*.*" # Trigger only on version tags

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                # os: [ubuntu-latest, macos-latest, windows-latest]
                # arch: [x64, ia32]
                include:
                    - os: ubuntu-latest
                      arch: x64
                    # - os: ubuntu-latest # BUG: This one doesn't work.
                    #   arch: ia32
                    - os: ubuntu-latest
                      arch: arm64
                    - os: ubuntu-latest
                      arch: armv7l
                    - os: macos-15-intel
                      arch: x64
                    # - os: macos-latest # BUG: This one doesn't work.
                    #   arch: ia32
                    - os: macos-latest
                      arch: arm64
                    # - os: macos-latest # BUG: This one doesn't work.
                    #   arch: armv7l
                    - os: windows-latest
                      arch: x64
                    - os: windows-latest
                      arch: ia32
                      node-version: 22.x
                    # - os: windows-11-arm # Disabled because Windows arm64 can run x64 apps.
                    #   arch: arm64
                    # - os: windows-latest # BUG: This one doesn't work.
                    #   arch: armv7l
        runs-on: ${{ matrix.os }}
        name: Build ${{ matrix.os }} (${{ matrix.arch }})
        permissions: write-all
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version || '22.x' }}

            - name: Install dependencies
              # Add `--ignore-scripts` because leveldb-zlib's install script is broken, so it is ignored and then fixed with the next step before being run.
              run: npm install # --ignore-scripts
              env:
                  LEVELDB_ZLIB_ARCH_OVERRIDE: ${{ matrix.arch }}

            - name: Import Developer ID certificate
              if: matrix.os == 'macos-latest'
              run: |
                  echo "$MAC_CERT_P12" | base64 --decode > certificate.p12
                  security create-keychain -p "" build.keychain
                  security list-keychains -s build.keychain
                  security unlock-keychain -p "" build.keychain
                  security import certificate.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
                  KEY_HASH=$(security find-identity -v -p codesigning build.keychain | head -n 1 | awk '{print $2}')
                  security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
                  security set-key-partition-list -S apple-tool:,apple: -s -k "" -D "$KEY_HASH" -t private
              env:
                  MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
                  MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}

            # - name: Build leveldb-zlib binaries
            #   run: npm run build-leveldb-zlib

            # - name: Make distributables
            #   run: npm run make -- --dry-run --arch="${{ matrix.arch }}"

            - name: Publish to GitHub Releases
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_OPTIONS: --max-old-space-size=4096
                  LEVELDB_ZLIB_ARCH_OVERRIDE: ${{ matrix.arch }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_ID_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: npm run publish -- --arch="${{ matrix.arch }}"

            - name: Attest artifacts
              uses: actions/attest@v4
              with:
                subject-path: "${{ github.workspace }}/out/make/**/*"

            - name: Debug (Windows)
              if: always() && matrix.os == 'windows-latest'
              run: dir -r out

            - name: Debug (Non-Windows)
              if: always() && matrix.os != 'windows-latest'
              run: find out
