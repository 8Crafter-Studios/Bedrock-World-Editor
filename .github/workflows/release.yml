name: Release

on:
    # Allows you to run this workflow manually from the Actions tab or through HTTP API
    workflow_dispatch:

    push:
        tags:
            - "v*.*.*" # Trigger only on version tags

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                # os: [ubuntu-latest, macos-latest, windows-latest]
                # arch: [x64, ia32]
                include:
                    # - os: ubuntu-latest # TEMP: Temporarily disabled while testing SignPath code signing setup.
                    #   arch: x64
                    # - os: ubuntu-latest # BUG: This one doesn't work.
                    #   arch: ia32
                    # - os: ubuntu-latest # TEMP: Temporarily disabled while testing SignPath code signing setup.
                    #   arch: arm64
                    # - os: ubuntu-latest # TEMP: Temporarily disabled while testing SignPath code signing setup.
                    #   arch: armv7l
                    # - os: macos-latest # TEMP: Temporarily disabled while testing SignPath code signing setup.
                    #   arch: x64
                    # - os: macos-latest # BUG: This one doesn't work.
                    #   arch: ia32
                    # - os: macos-latest # TEMP: Temporarily disabled while testing SignPath code signing setup.
                    #   arch: arm64
                    # - os: macos-latest # BUG: This one doesn't work.
                    #   arch: armv7l
                    - os: windows-latest
                      arch: x64
                    - os: windows-latest
                      arch: ia32
                      node-version: 22.x
                    # - os: windows-11-arm # Disabled because Windows arm64 can run x64 apps.
                    #   arch: arm64
                    # - os: windows-latest # BUG: This one doesn't work.
                    #   arch: armv7l
        runs-on: ${{ matrix.os }}
        name: Build ${{ matrix.os }} (${{ matrix.arch }})
        permissions: write-all
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version || '22.x' }}

            - name: Install dependencies
              # Add `--ignore-scripts` because leveldb-zlib's install script is broken, so it is ignored and then fixed with the next step before being run.
              run: npm install # --ignore-scripts
              env:
                  LEVELDB_ZLIB_ARCH_OVERRIDE: ${{ matrix.arch }}

            - name: Import Developer ID certificate
              if: matrix.os == 'macos-latest'
              run: |
                  echo "$MAC_CERT_P12" | base64 --decode > certificate.p12
                  security create-keychain -p "" build.keychain
                  security list-keychains -s build.keychain
                  security unlock-keychain -p "" build.keychain
                  security import certificate.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
                  KEY_HASH=$(security find-identity -v -p codesigning build.keychain | head -n 1 | awk '{print $2}')
                  security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
                  security set-key-partition-list -S apple-tool:,apple: -s -k "" -D "$KEY_HASH" -t private
              env:
                  MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
                  MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}

            # - name: Build leveldb-zlib binaries
            #   run: npm run build-leveldb-zlib

            # - name: Make distributables
            #   run: npm run make -- --dry-run --arch="${{ matrix.arch }}"

            - name: Publish to GitHub Releases (Non-Windows)
              if: matrix.os != 'windows-latest'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_OPTIONS: --max-old-space-size=4096
                  LEVELDB_ZLIB_ARCH_OVERRIDE: ${{ matrix.arch }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_ID_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: npm run publish -- --arch="${{ matrix.arch }}"

            - name: Publish to GitHub Releases (Windows) (Dry Run)
              if: matrix.os == 'windows-latest'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_OPTIONS: --max-old-space-size=4096
                  LEVELDB_ZLIB_ARCH_OVERRIDE: ${{ matrix.arch }}
              run: npm run publish -- --arch="${{ matrix.arch }}" --dry-run

            - name: Create directory of artifacts for SignPath signing
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                New-Item -ItemType Directory -Force artifacts-to-sign-${{matrix.arch}}

                Copy-Item "out/make/squirrel.windows/${{matrix.arch}}/*Setup*.exe" artifacts-to-sign-${{matrix.arch}}

                Copy-Item "out/make/zip/win32/${{matrix.arch}}/*.zip" artifacts-to-sign-${{matrix.arch}}

            - name: Upload unsigned Windows artifacts for signing
              if: matrix.os == 'windows-latest'
              id: upload-for-signing
              uses: actions/upload-artifact@v4
              with:
                name: windows-${{matrix.arch}}-artifacts
                path: artifacts-to-sign-${{matrix.arch}}

            - name: Submit signing request
              if: matrix.os == 'windows-latest'
              id: sign
              uses: signpath/github-action-submit-signing-request@v2
              with:
                api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
                organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
                project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
                signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
                artifact-configuration-slug: installer_and_portable
                github-artifact-id: ${{ steps.upload-for-signing.outputs.artifact-id }}
                wait-for-completion: true
                output-artifact-directory: signed/
                wait-for-completion-timeout-in-seconds: 3600

            - name: Debug signed dir (Windows)
              if: always() && matrix.os == 'windows-latest'
              run: dir -r signed

            - name: Extract signed ZIP and replace unsigned artifacts
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                $extractDir = "signed"

                $signedExe = Get-ChildItem $extractDir -Filter "*Setup*.exe" | Select-Object -First 1

                if (-not $signedExe) {
                  Write-Error "No signed installer EXE (*Setup*.exe) found in $extractDir"
                }

                $signedPortableZip = Get-ChildItem $extractDir -Filter "*.zip" | Select-Object -First 1

                if (-not $signedPortableZip) {
                  Write-Error "No signed portable ZIP (*.zip) found in $extractDir"
                }

                $origExeDir = "out/make/squirrel.windows/${{matrix.arch}}"
                $origZipDir = "out/make/zip/win32/${{matrix.arch}}"

                Remove-Item "$origExeDir/*Setup*.exe" -Force -ErrorAction SilentlyContinue
                Remove-Item "$origZipDir/*.zip" -Force -ErrorAction SilentlyContinue

                Copy-Item $signedExe.FullName $origExeDir
                Copy-Item $signedPortableZip.FullName $origZipDir


            - name: Publish to GitHub Releases (Windows) (From Dry Run)
              if: matrix.os == 'windows-latest'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_OPTIONS: --max-old-space-size=4096
                  LEVELDB_ZLIB_ARCH_OVERRIDE: ${{ matrix.arch }}
              run: npm run publish -- --arch="${{ matrix.arch }}" --from-dry-run

            - name: Attest artifacts
              uses: actions/attest@v4
              with:
                subject-path: "${{ github.workspace }}/out/make/**/*"

            - name: Debug (Windows)
              if: always() && matrix.os == 'windows-latest'
              run: dir -r out

            - name: Debug (Non-Windows)
              if: always() && matrix.os != 'windows-latest'
              run: find out
